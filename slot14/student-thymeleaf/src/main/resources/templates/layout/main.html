<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- TODO 8.1: Tiêu đề trang -->
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">Student Manager</title>

    <!-- TODO 8.2: Bootstrap offline và CSS riêng -->
    <link rel="stylesheet" href="../../static/vendor/bootstrap/css/bootstrap.min.css" th:href="@{/vendor/bootstrap/css/bootstrap.min.css}">
    <link rel="stylesheet" href="../../static/vendor/bootstrap-icons/bootstrap-icons.min.css" th:href="@{/vendor/bootstrap-icons/bootstrap-icons.min.css}">
    <link rel="stylesheet" href="../../static/css/style.css" th:href="@{/css/style.css}">
</head>

<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">

        <a class="navbar-brand"
           th:href="@{/students}">
            Student Manager
        </a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNav"
                aria-controls="mainNav"
                aria-expanded="false"
                aria-label="Mở menu">

            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav ms-auto">

                <!-- TODO 8.3: Menu danh sách -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/students}"
                       th:classappend="${activeMenu == 'list'} ? ' active' : ''"
                       th:attr="aria-current=${activeMenu == 'list' ? 'page' : null}">
                        Danh sách
                    </a>
                </li>

                <!-- TODO 8.3: Menu thêm mới -->
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/students/new}"
                       th:classappend="${activeMenu == 'new'} ? ' active' : ''"
                       th:attr="aria-current=${activeMenu == 'new' ? 'page' : null}">
                        Thêm mới
                    </a>
                </li>

            </ul>
        </div>
    </div>
</nav>

<main class="container my-4 flex-grow-1">

    <!-- TODO 8.4: Thông báo thành công -->
    <div th:if="${successMessage != null}"
         class="alert alert-success alert-dismissible fade show"
         role="alert">

        <span th:text="${successMessage}">
            Thao tác thành công.
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng">
        </button>
    </div>

    <!-- TODO 8.4: Thông báo lỗi -->
    <div th:if="${errorMessage != null}"
         class="alert alert-danger alert-dismissible fade show"
         role="alert">

        <span th:text="${errorMessage}">
            Đã xảy ra lỗi.
        </span>

        <button type="button"
                class="btn-close"
                data-bs-dismiss="alert"
                aria-label="Đóng">
        </button>
    </div>

    <!-- TODO 8.5: Vùng nội dung trang con -->
    <div layout:fragment="content">
        <!-- Nội dung từ trang con sẽ được chèn vào đây. -->
    </div>

</main>

<footer class="bg-dark text-white-50 text-center py-3">

    <!-- TODO 8.6: Năm hiện tại -->
    &copy;
    <span th:text="${#temporals.year(#temporals.createNow())}">
        2026
    </span>

    HSF302 – Student Manager

</footer>

<!-- TODO 8.7: Bootstrap JavaScript offline -->
<script src="../../static/vendor/bootstrap/js/bootstrap.bundle.min.js" th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
