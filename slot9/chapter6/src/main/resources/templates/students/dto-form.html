<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::section})}">

<head>
    <title th:text="${pageTitle}">Student Form DTO</title>
</head>

<body>
<section>

    <div class="row justify-content-center">
        <div class="col-md-7">

            <nav aria-label="breadcrumb" class="mb-3">
                <ol class="breadcrumb">

                    <li class="breadcrumb-item">
                        <a th:href="@{/students}">
                            Sinh viên
                        </a>
                    </li>

                    <li class="breadcrumb-item active"
                        th:text="${pageTitle}">
                        Form DTO
                    </li>

                </ol>
            </nav>

            <div class="card shadow-sm">

                <div class="card-header bg-success text-white">

                    <h5 class="mb-0">
                        <i class="bi bi-box me-2"></i>
                        <span th:text="${pageTitle}">
                            Form DTO
                        </span>
                    </h5>

                </div>

                <div class="card-body">

                    <form th:action="${dtoEdit}
                            ? @{/students/dto/{id}/edit(id=${studentForm.id})}
                            : @{/students/dto/create}"
                          th:object="${studentForm}"
                          method="post"
                          novalidate>

                        <div th:if="${#fields.hasAnyErrors()}"
                             class="alert alert-warning py-2">

                            Vui lòng kiểm tra lại các trường
                            được đánh dấu đỏ.

                        </div>

                        <!-- Họ tên -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Họ tên
                                <span class="text-danger">*</span>
                            </label>

                            <input type="text"
                                   class="form-control"
                                   th:field="*{name}"
                                   th:errorclass="is-invalid"
                                   placeholder="Nhập họ và tên"/>

                            <div class="invalid-feedback"
                                 th:errors="*{name}">
                                Lỗi tên
                            </div>

                        </div>

                        <!-- Email -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Email
                                <span class="text-danger">*</span>
                            </label>

                            <input type="email"
                                   class="form-control"
                                   th:field="*{email}"
                                   th:errorclass="is-invalid"
                                   placeholder="example@fpt.edu.vn"/>

                            <div class="invalid-feedback"
                                 th:errors="*{email}">
                                Lỗi email
                            </div>

                        </div>

                        <!-- Tuổi -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Tuổi
                                <span class="text-danger">*</span>
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{age}"
                                   th:errorclass="is-invalid"
                                   min="18"
                                   max="30"/>

                            <div class="invalid-feedback"
                                 th:errors="*{age}">
                                Lỗi tuổi
                            </div>

                        </div>

                        <!-- Chuyên ngành -->
                        <div class="mb-3">

                            <label class="form-label fw-semibold">
                                Chuyên ngành
                                <span class="text-danger">*</span>
                            </label>

                            <select class="form-select"
                                    th:field="*{major}"
                                    th:errorclass="is-invalid">

                                <option value="">
                                    -- Chọn chuyên ngành --
                                </option>

                                <option th:each="m : ${majors}"
                                        th:value="${m}"
                                        th:text="${m}">
                                </option>

                            </select>

                            <div class="invalid-feedback"
                                 th:errors="*{major}">
                                Lỗi chuyên ngành
                            </div>

                        </div>

                        <!-- GPA -->
                        <div class="mb-4">

                            <label class="form-label fw-semibold">
                                GPA
                                <span class="text-danger">*</span>
                            </label>

                            <input type="number"
                                   class="form-control"
                                   th:field="*{gpa}"
                                   th:errorclass="is-invalid"
                                   step="0.1"
                                   min="0"
                                   max="4"
                                   placeholder="0.0 - 4.0"/>

                            <div class="form-text">
                                Thang điểm 4.0
                            </div>

                            <div class="invalid-feedback"
                                 th:errors="*{gpa}">
                                Lỗi GPA
                            </div>

                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-success">

                                <i class="bi bi-save me-1"></i>

                                <span th:text="${dtoEdit}
                                        ? 'Cập nhật'
                                        : 'Thêm mới'">
                                    Lưu
                                </span>

                            </button>

                            <a th:href="@{/students}"
                               class="btn btn-outline-secondary">

                                <i class="bi bi-x-lg me-1"></i>
                                Hủy

                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</section>
</body>
</html>
