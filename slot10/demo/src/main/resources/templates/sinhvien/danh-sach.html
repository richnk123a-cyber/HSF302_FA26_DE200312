<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/layout :: commonHead(${tieuDe})}"></th:block>
</head>
<body>

<!-- Navbar dùng chung -->
<nav th:replace="~{fragments/layout :: navbar('sinhvien')}"></nav>

<main class="container py-4">

    <!-- Thông báo dùng chung -->
    <th:block th:replace="~{fragments/layout :: alerts}"></th:block>

    <h1 class="h3 mb-3" th:text="${tieuDe}">Tiêu đề</h1>

    <!-- Có dữ liệu thì hiện bảng -->
    <table class="table table-bordered table-hover bg-white"
           th:unless="${#lists.isEmpty(sinhViens)}">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Mã SV</th>
            <th>Họ tên</th>
            <th class="text-end">Điểm TB</th>
            <th>Xếp loại</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="sv, stat : ${sinhViens}">
            <td th:text="${stat.count}">1</td>
            <td th:text="${sv.maSV}">SV001</td>
            <td th:text="${sv.hoTen}">Nguyễn Văn A</td>
            <td class="text-end"
                th:text="${#numbers.formatDecimal(sv.diemTB, 1, 1)}">8.5</td>
            <td>
                <span th:if="${sv.diemTB >= 8.0}"
                      class="badge bg-success">Giỏi</span>
                <span th:if="${sv.diemTB >= 6.5 and sv.diemTB < 8.0}"
                      class="badge bg-primary">Khá</span>
                <span th:if="${sv.diemTB < 6.5}"
                      class="badge bg-danger">Trung bình</span>
            </td>
        </tr>
        </tbody>
    </table>

    <!-- Danh sách rỗng -->
    <div th:if="${#lists.isEmpty(sinhViens)}"
         class="alert alert-info">
        Không có sinh viên nào.
    </div>

    <p class="text-muted"
       th:unless="${#lists.isEmpty(sinhViens)}">
        Tổng: <strong th:text="${#lists.size(sinhViens)}">0</strong>
        sinh viên
    </p>
</main>

<!-- Footer dùng chung -->
<footer th:replace="~{fragments/layout :: footer}"></footer>

<!-- Bootstrap JS dùng chung -->
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
